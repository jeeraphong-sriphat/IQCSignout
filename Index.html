<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf8fc;
      --card: #ffffff;
      --ink: #4a4458;
      --ink-soft: #8b849c;
      --lavender: #cdb8f0;
      --lavender-dark: #a78bd8;
      --mint: #bfe8dc;
      --peach: #f7d9c4;
      --pink: #f4c9d6;
      --line: #eee6f7;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Mali', 'Segoe UI', sans-serif;
      margin: 0; padding: 24px;
      background: var(--bg);
      color: var(--ink);
    }
    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 24px;
      max-width: 640px;
      margin: 0 auto 16px;
      box-shadow: 0 4px 20px rgba(180, 160, 220, 0.15);
      border: 1px solid var(--line);
    }
    h2 { margin-top: 0; font-size: 20px; font-weight: 600; color: var(--ink); }
    select, button {
      font-family: 'Mali', sans-serif;
      font-size: 16px;
      padding: 10px 14px;
      border-radius: 14px;
      border: 1.5px solid var(--line);
      width: 100%;
      box-sizing: border-box;
      background: #fdfcff;
    }
    button {
      background: var(--lavender);
      color: #3d3450;
      border: none;
      cursor: pointer;
      margin-top: 12px;
      font-weight: 600;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    button:hover:not(:disabled) { background: var(--lavender-dark); }
    button:active:not(:disabled) { transform: scale(0.98); }
    button:disabled { background: #e5e0ee; color: #a89fc0; cursor: not-allowed; }
    button.secondary { background: #f1edf9; color: var(--ink-soft); }
    button.secondary:hover { background: #e7e0f4; }
    table.preview { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 15px; }
    table.preview td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    table.preview td:first-child { color: var(--ink-soft); width: 42%; }
    .status { padding: 12px 14px; border-radius: 14px; margin-top: 14px; font-size: 15px; }
    .status.error { background: #fbe4ea; color: #a6455e; }
    .status.success { background: var(--mint); color: #2f6b58; }
    .status.info { background: #eef0fb; color: #5b5f93; }
    .hidden { display: none; }

    /* ---- Form-style preview (จำลอง FM-LAB-014) ---- */
    .form-doc {
      margin-top: 18px;
      border: 1.5px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      background: #fffefb;
    }
    .form-doc-header {
      background: linear-gradient(135deg, var(--lavender) 0%, var(--pink) 100%);
      padding: 14px 18px;
      color: #3d3450;
    }
    .form-doc-header .doc-title { font-weight: 700; font-size: 17px; }
    .form-doc-header .doc-meta { font-size: 13px; opacity: 0.85; margin-top: 2px; }
    .form-doc-top {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 8px; padding: 12px 18px; background: #f6f2fb; font-size: 14px;
    }
    .form-doc-top div span { display: block; color: var(--ink-soft); font-size: 12px; }
    .form-section { padding: 12px 18px; border-top: 1px dashed var(--line); }
    .form-section-title {
      font-weight: 700; font-size: 15px; color: var(--lavender-dark);
      margin-bottom: 8px;
    }
    .form-item {
      display: flex; align-items: flex-start; gap: 8px;
      padding: 4px 0; font-size: 14px; color: var(--ink-soft);
    }
    .form-item.checked { color: var(--ink); }
    .form-item .box {
      flex: none; width: 18px; height: 18px; border-radius: 5px;
      border: 1.5px solid #c9c0dc; display: flex; align-items: center; justify-content: center;
      font-size: 12px; margin-top: 1px;
    }
    .form-item.checked .box { background: var(--mint); border-color: #7fc9b3; color: #2f6b58; }
    .form-item .label { min-width: 150px; flex: none; }
    .form-item .value { font-weight: 600; }
    .form-empty { font-size: 13px; color: #c3bcd4; font-style: italic; padding: 4px 0; }
    .form-signrow {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 10px; padding: 10px 12px; background: #f9f7fc; border-radius: 10px; font-size: 14px;
    }
    .form-signrow .sign-status.signed { color: #2f6b58; font-weight: 700; }
    .form-signrow .sign-status.pending { color: #a6455e; }

    /* ---- Signature pad ---- */
    .sigpad-wrap { margin-top: 16px; }
    .sigpad-label { font-size: 14px; color: var(--ink-soft); margin-bottom: 6px; }
    #sigCanvas {
      width: 100%; height: 150px; border-radius: 14px;
      border: 1.5px dashed #c9c0dc; background: #fffffe; touch-action: none; cursor: crosshair;
    }
    .sigpad-actions { display: flex; gap: 10px; margin-top: 8px; align-items: center; }
    .sigpad-actions button { margin-top: 0; }
  </style>
</head>
<body>

  <div class="card" id="authCard">
    <h2>กำลังตรวจสอบสิทธิ์...</h2>
  </div>

  <div class="card hidden" id="mainCard" style="max-width: 820px;">
    <h2>เลือกรายการที่รอลงนามอนุมัติ (CAIQC)</h2>
    <select id="recordSelect">
      <option value="">-- เลือกเลขที่บันทึก --</option>
    </select>

    <div id="previewSection" class="hidden">
      <div id="previewForm"></div>

      <div class="sigpad-wrap">
        <div class="sigpad-label">✍️ วาดลายเซ็นของท่านในกรอบด้านล่าง</div>
        <canvas id="sigCanvas"></canvas>
        <div class="sigpad-actions">
          <button type="button" id="sigClearBtn" class="secondary">ล้างลายเซ็น</button>
        </div>
      </div>

      <button id="signBtn">ยืนยันและลงนามอนุมัติ</button>
      <button id="cancelBtn" class="secondary">ยกเลิก / เลือกรายการอื่น</button>
    </div>

    <div id="statusBox"></div>
  </div>

  <div class="card hidden" id="revokeCard" style="max-width: 820px;">
    <h2>🔓 ยกเลิกการลงนามที่เซ็นไปแล้ว</h2>
    <select id="revokeSelect">
      <option value="">-- เลือกรายการที่เซ็นแล้ว --</option>
    </select>

    <div id="revokeDetail" class="hidden">
      <table class="preview" id="revokeTable"></table>
      <div class="sigpad-label" style="margin-top:14px;">เหตุผลในการยกเลิกการลงนาม (บังคับกรอก)</div>
      <textarea id="revokeReason" rows="2" style="width:100%; font-family:'Mali',sans-serif; font-size:15px; border-radius:14px; border:1.5px solid var(--line); padding:10px 14px; box-sizing:border-box;"></textarea>
      <button id="revokeBtn" style="background:#f4c9d6; color:#7a3547;">ยืนยันยกเลิกการลงนามนี้</button>
      <button id="revokeCancelBtn" class="secondary">ปิด</button>
    </div>

    <div id="revokeStatusBox"></div>
  </div>

<script>
  let currentRecord = null; // เก็บ record ที่กำลัง preview อยู่ (รวม _rowNumber)
  let sigHasDrawn = false;

  function showStatus(msg, type) {
    const box = document.getElementById('statusBox');
    box.innerHTML = '<div class="status ' + type + '">' + msg + '</div>';
  }

  // ---- Signature pad setup ----
  const sigCanvas = document.getElementById('sigCanvas');
  const sigCtx = sigCanvas.getContext('2d');
  let sigDrawing = false;

  function resizeSigCanvas() {
    // เก็บลายเซ็นเดิมไว้ไม่ได้ระหว่าง resize จึงล้างใหม่ (กรณีหน้าจอหมุน/ปรับขนาด)
    const rect = sigCanvas.getBoundingClientRect();
    const ratio = window.devicePixelRatio || 1;
    sigCanvas.width = rect.width * ratio;
    sigCanvas.height = rect.height * ratio;
    sigCtx.scale(ratio, ratio);
    sigCtx.lineWidth = 5.5;
    sigCtx.lineCap = 'round';
    sigCtx.lineJoin = 'round';
    sigCtx.strokeStyle = '#1a1625';
    sigHasDrawn = false;
  }
  window.addEventListener('resize', resizeSigCanvas);

  function getSigPos(e) {
    const rect = sigCanvas.getBoundingClientRect();
    const point = (e.touches && e.touches[0]) ? e.touches[0] : e;
    return { x: point.clientX - rect.left, y: point.clientY - rect.top };
  }

  function sigStart(e) {
    e.preventDefault();
    sigDrawing = true;
    const p = getSigPos(e);
    sigCtx.beginPath();
    sigCtx.moveTo(p.x, p.y);
  }
  function sigMove(e) {
    if (!sigDrawing) return;
    e.preventDefault();
    const p = getSigPos(e);
    sigCtx.lineTo(p.x, p.y);
    sigCtx.stroke();
    sigHasDrawn = true;
  }
  function sigEnd(e) {
    sigDrawing = false;
  }

  sigCanvas.addEventListener('mousedown', sigStart);
  sigCanvas.addEventListener('mousemove', sigMove);
  window.addEventListener('mouseup', sigEnd);
  sigCanvas.addEventListener('touchstart', sigStart, { passive: false });
  sigCanvas.addEventListener('touchmove', sigMove, { passive: false });
  sigCanvas.addEventListener('touchend', sigEnd);

  document.getElementById('sigClearBtn').addEventListener('click', function() {
    sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
    sigHasDrawn = false;
  });

  // ---- 1. เช็คสิทธิ์ก่อนแสดง UI ----
  google.script.run
    .withSuccessHandler(function(status) {
      const authCard = document.getElementById('authCard');
      if (!status.authorized) {
        authCard.innerHTML = '<h2>ไม่มีสิทธิ์เข้าถึง</h2><p>บัญชี ' + (status.email || '(ไม่พบอีเมล)') +
          ' ไม่ได้รับอนุญาตให้ลงนามอนุมัติหน้านี้</p>';
        return;
      }
      authCard.classList.add('hidden');
      document.getElementById('mainCard').classList.remove('hidden');
      document.getElementById('revokeCard').classList.remove('hidden');
      loadPendingRecords();
      loadSignedRecords();
    })
    .withFailureHandler(function(err) {
      document.getElementById('authCard').innerHTML = '<h2>เกิดข้อผิดพลาด</h2><p>' + err.message + '</p>';
    })
    .getCurrentUserStatus();

  // ---- 2. โหลดรายการที่รอเซ็น ----
  function loadPendingRecords() {
    google.script.run
      .withSuccessHandler(function(records) {
        const select = document.getElementById('recordSelect');
        select.innerHTML = '<option value="">-- เลือกเลขที่บันทึก --</option>';
        records.forEach(function(rec) {
          const opt = document.createElement('option');
          opt.value = rec.id;
          opt.textContent = rec.id + ' | ' + rec.date + ' | ' + rec.test + ' | ' + rec.problem;
          select.appendChild(opt);
        });
        if (records.length === 0) {
          showStatus('ไม่มีรายการที่รอลงนามในขณะนี้', 'info');
        }
      })
      .withFailureHandler(function(err) {
        showStatus('โหลดรายการไม่สำเร็จ: ' + err.message, 'error');
      })
      .getPendingRecords();
  }

  // ---- 3. เลือกรายการ -> แสดง preview ----
  document.getElementById('recordSelect').addEventListener('change', function(e) {
    const id = e.target.value;
    console.log('[recordSelect change] id =', JSON.stringify(id));
    document.getElementById('statusBox').innerHTML = '';
    if (!id) {
      document.getElementById('previewSection').classList.add('hidden');
      return;
    }
    google.script.run
      .withSuccessHandler(function(raw) {
        console.log('[getRecordDetail success] raw =', raw, typeof raw);
        let record = null;
        if (raw && typeof raw === 'object') {
          record = raw; // เผื่อ deployment เก่ายังคืน object ตรงๆ
        } else if (typeof raw === 'string' && raw) {
          try {
            record = JSON.parse(raw);
          } catch (parseErr) {
            console.error('[getRecordDetail] JSON.parse failed', parseErr);
          }
        }
        if (!record) {
          showStatus('เซิร์ฟเวอร์ส่งข้อมูลกลับมาว่างเปล่าสำหรับ ' + id + ' (ดู console log เพิ่มเติม)', 'error');
          document.getElementById('previewSection').classList.add('hidden');
          return;
        }
        currentRecord = record;
        renderPreview(record);
        document.getElementById('previewSection').classList.remove('hidden');
        // เตรียม canvas ลายเซ็นใหม่ (ว่างเปล่าเสมอ) ทุกครั้งที่เปลี่ยนรายการ
        setTimeout(resizeSigCanvas, 0);
      })
      .withFailureHandler(function(err) {
        console.error('[getRecordDetail failure]', err);
        showStatus('โหลดข้อมูลไม่สำเร็จ: ' + err.message, 'error');
      })
      .getRecordDetail(id);
  });

  function renderPreview(record) {
    if (!record) { console.error('renderPreview called with null record'); return; }

    const g = (key) => (record[key] || '').toString().trim();
    const has = (key) => g(key) !== '';

    // แต่ละหมวดใน section 2/4/5 คือ [ป้ายชื่อ, ฟิลด์ที่ใช้เช็คว่า "ติ๊ก", ฟิลด์ค่าที่จะโชว์ (ถ้าต่างจากฟิลด์เช็ค)]
    function item(label, checkKey, displayValue) {
      const checked = has(checkKey);
      const value = displayValue !== undefined ? displayValue : g(checkKey);
      return '<div class="form-item' + (checked ? ' checked' : '') + '">' +
        '<div class="box">' + (checked ? '✓' : '') + '</div>' +
        '<div class="label">' + label + '</div>' +
        '<div class="value">' + (checked ? value : '-') + '</div>' +
        '</div>';
    }

    function sectionEmptyIfNone(htmlParts) {
      const visible = htmlParts.filter(Boolean);
      return visible.length ? visible.join('') : '<div class="form-empty">ไม่มีข้อมูลในหัวข้อนี้</div>';
    }

    // ---- ส่วนหัวเอกสาร (คงที่) ----
    const header =
      '<div class="form-doc-header">' +
        '<div class="doc-title">แบบบันทึกการแก้ไข เมื่อผล IQC ไม่อยู่ในเกณฑ์ (IQC Corrective Action Form)</div>' +
        '<div class="doc-meta">FM-LAB-014 · แผนกปฏิบัติการกลาง · เลขที่ ' + g('No.') + '</div>' +
      '</div>';

    // ---- แถวบน: วันที่ / Test / Instrument ----
    const topRow =
      '<div class="form-doc-top">' +
        '<div><span>วันที่</span>' + (g('วันที่ (พ.ศ.)') || '-') + '</div>' +
        '<div><span>การทดสอบ (Test)</span>' + (g('Test') || '-') + '</div>' +
        '<div><span>เครื่องตรวจวิเคราะห์</span>' + (g('Instrument') || '-') + '</div>' +
      '</div>';

    // ---- 1. สภาพปัญหา ----
    const section1 =
      '<div class="form-section">' +
        '<div class="form-section-title">1. สภาพปัญหา</div>' +
        '<div class="form-item checked"><div class="value">' + (g('สภาพปัญหา') || '-') + '</div></div>' +
      '</div>';

    // ---- 2. การทบทวน และการตรวจสอบอื่น ๆ ----
    const section2 =
      '<div class="form-section">' +
        '<div class="form-section-title">2. การทบทวน และการตรวจสอบอื่น ๆ</div>' +
        sectionEmptyIfNone([
          has('Reagent Lot No.') ? item('Reagent Lot No. / Exp / สถานะ', 'Reagent Lot No.',
            g('Reagent Lot No.') + (has('Reagent Exp Date') ? ' (Exp ' + g('Reagent Exp Date') + ')' : '') +
            (has('สถานะ Reagent') ? ' — ' + g('สถานะ Reagent') : '')) : '',
          has('Control Lot No.') ? item('Control Material Lot No. / Exp / สถานะ', 'Control Lot No.',
            g('Control Lot No.') + (has('Control Exp Date') ? ' (Exp ' + g('Control Exp Date') + ')' : '') +
            (has('สถานะ Control') ? ' — ' + g('สถานะ Control') : '')) : '',
          has('Calibrator Lot No.') ? item('Calibrator Lot No. / Exp / สถานะ', 'Calibrator Lot No.',
            g('Calibrator Lot No.') + (has('Cal Exp Date') ? ' (Exp ' + g('Cal Exp Date') + ')' : '') +
            (has('สถานะ  Calibrator') ? ' — ' + g('สถานะ  Calibrator') : '')) : '',
          has('เครื่องตรวจวิเคราะห์') ? item('Instrument (PM, Calibration)', 'เครื่องตรวจวิเคราะห์') : '',
          has('วิธีการเตรียม Control') ? item('Technique', 'วิธีการเตรียม Control') : ''
        ]) +
      '</div>';

    // ---- 3. ผลกระทบต่อการรายงานผลผู้ป่วย ----
    const section3 =
      '<div class="form-section">' +
        '<div class="form-section-title">3. ผลกระทบต่อการรายงานผลผู้ป่วย</div>' +
        item('ระดับผลกระทบ', 'ระดับความรุนแรง') +
      '</div>';

    // ---- 4. สรุปสาเหตุของปัญหาเกิดจาก ----
    const section4 =
      '<div class="form-section">' +
        '<div class="form-section-title">4. สรุปสาเหตุของปัญหาเกิดจาก</div>' +
        sectionEmptyIfNone([
          has('1. Reagent') ? item('Reagent', '1. Reagent') : '',
          has('2. Control Material') ? item('Control Material', '2. Control Material') : '',
          has('3. Calibration') ? item('Calibration', '3. Calibration') : '',
          has('4. เครื่องตรวจวิเคราะห์') ? item('เครื่องตรวจวิเคราะห์', '4. เครื่องตรวจวิเคราะห์') : '',
          has('5. การเตรียม Control') ? item('การเตรียม Control (Technique)', '5. การเตรียม Control') : ''
        ]) +
      '</div>';

    // ---- 5. ปฏิบัติการแก้ไข (ระบุ) ----
    const section5 =
      '<div class="form-section">' +
        '<div class="form-section-title">5. ปฏิบัติการแก้ไข (ระบุ)</div>' +
        sectionEmptyIfNone([
          has('น้ำยาตรวจวิเคราะห์') ? item('Reagent', 'น้ำยาตรวจวิเคราะห์') : '',
          has('น้ำยา Control') ? item('Control Material', 'น้ำยา Control') : '',
          has('น้ำยา Calibrator') ? item('Calibration', 'น้ำยา Calibrator') : '',
          has('การแก้ไขเครื่องตรวจวิเคราะห์') ? item('เครื่องตรวจวิเคราะห์', 'การแก้ไขเครื่องตรวจวิเคราะห์',
            g('การแก้ไขเครื่องตรวจวิเคราะห์') + (has('ระบุส่วนที่แก้ไข/ซ่อม') ? ' (' + g('ระบุส่วนที่แก้ไข/ซ่อม') + ')' : '')) : '',
          has('การจัดการตัวอย่างผู้ป่วย') ? item('ตัวอย่างผู้ป่วย', 'การจัดการตัวอย่างผู้ป่วย') : ''
        ]) +
      '</div>';

    // ---- 6. ผลการแก้ไข ----
    let resultLine = '<div class="form-empty">ยังไม่ระบุผลการแก้ไข</div>';
    if (has('แก้ไขได้')) resultLine = item('ผลการแก้ไข', 'แก้ไขได้', '✅ แก้ไขได้ (' + g('แก้ไขได้ (พ.ศ.)') + ')');
    else if (has('แก้ไขไม่ได้')) resultLine = item('ผลการแก้ไข', 'แก้ไขไม่ได้', '⚠️ แก้ไขไม่ได้ เพราะ ' + g('แก้ไขไม่ได้'));
    else if (has('ติดตามเฝ้าระวัง')) resultLine = item('ผลการแก้ไข', 'ติดตามเฝ้าระวัง', '👁️ ติดตามเฝ้าระวัง (' + g('ติดตามเฝ้าระวัง') + ')');

    const section6 =
      '<div class="form-section">' +
        '<div class="form-section-title">6. ผลการแก้ไข</div>' +
        resultLine +
        '<div class="form-signrow">' +
          '<span>ลงนามผู้แก้ไข / บันทึกการแก้ไข</span>' +
          '<span>' + (g('ผู้บันทึก') || '-') + (has('วันที่ (พ.ศ.)') ? ' · ' + g('วันที่ (พ.ศ.)') : '') + '</span>' +
        '</div>' +
      '</div>';

    // ---- 7. สรุปการแก้ไข + ลงนามผู้ตรวจสอบ + ลงนามหัวหน้า ----
    const headSigned = record['Signed_Head'] === true || record['Signed_Head'] === 'TRUE' || record['Signed_Head'] === 'true';
    const section7 =
      '<div class="form-section">' +
        '<div class="form-section-title">7. สรุปการแก้ไข</div>' +
        '<div class="form-item checked"><div class="value">' + (g('สรุปการแก้ไข') || '-') + '</div></div>' +
        '<div class="form-signrow">' +
          '<span>ลงนามผู้ตรวจสอบการแก้ไข</span>' +
          '<span>' + (g('ผู้ตรวจสอบการแก้ไข') || '-') + (has('วันที่ (พ.ศ.)') ? ' · ' + g('วันที่ (พ.ศ.)') : '') + '</span>' +
        '</div>' +
        '<div class="form-signrow">' +
          '<span>ลงนามหัวหน้าแผนกปฏิบัติการกลางรับทราบ (' + (g('หัวหน้าแผนกปฏิบัติการกลาง') || '-') + ')</span>' +
          '<span class="sign-status ' + (headSigned ? 'signed' : 'pending') + '">' +
            (headSigned
              ? '✓ ลงนามแล้ว โดย ' + g('Signed_Head_By') + ' · ' + g('Signed_Head_DateTime')
              : '⏳ ยังไม่ได้ลงนาม') +
          '</span>' +
        '</div>' +
      '</div>';

    document.getElementById('previewForm').innerHTML =
      '<div class="form-doc">' + header + topRow + section1 + section2 + section3 + section4 + section5 + section6 + section7 + '</div>';
  }

  // ---- 4. ยืนยันและลงนาม ----
  document.getElementById('signBtn').addEventListener('click', function() {
    if (!currentRecord) return;
    if (!sigHasDrawn) {
      showStatus('กรุณาวาดลายเซ็นในกรอบก่อนกดยืนยัน', 'error');
      return;
    }
    if (!confirm('ยืนยันลงนามอนุมัติเลขที่ ' + currentRecord['No.'] + ' ใช่หรือไม่?\nการกระทำนี้ไม่สามารถย้อนกลับได้')) return;

    const signatureDataUrl = sigCanvas.toDataURL('image/png');

    const btn = this;
    btn.disabled = true;
    btn.textContent = 'กำลังบันทึก...';

    google.script.run
      .withSuccessHandler(function(result) {
        let msg = 'ลงนามสำเร็จ โดย ' + result.signedBy + ' เวลา ' + new Date(result.signedAt).toLocaleString('th-TH');
        if (result.pdfUrl) {
          msg += '<br><a href="' + result.pdfUrl + '" target="_blank" rel="noopener">เปิดดู PDF รายงานที่ลงนามแล้ว</a>';
        } else {
          msg += '<br><span style="opacity:0.8">(สร้าง PDF ไม่สำเร็จ — เช็ค AuditLog เพื่อดูสาเหตุ)</span>';
        }
        showStatus(msg, 'success');
        document.getElementById('previewSection').classList.add('hidden');
        document.getElementById('recordSelect').value = '';
        currentRecord = null;
        sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
        sigHasDrawn = false;
        loadPendingRecords(); // รีเฟรชรายการ (ตัวที่เพิ่งเซ็นจะหายไปจาก dropdown)
      })
      .withFailureHandler(function(err) {
        showStatus('ลงนามไม่สำเร็จ: ' + err.message, 'error');
        btn.disabled = false;
        btn.textContent = 'ยืนยันและลงนามอนุมัติ';
      })
      .signRecord(currentRecord['No.'], currentRecord['_rowNumber'], signatureDataUrl);
  });

  document.getElementById('cancelBtn').addEventListener('click', function() {
    document.getElementById('previewSection').classList.add('hidden');
    document.getElementById('recordSelect').value = '';
    currentRecord = null;
    document.getElementById('statusBox').innerHTML = '';
    sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
    sigHasDrawn = false;
  });

  // ================= ยกเลิกการลงนาม =================
  let currentRevokeRecord = null;
  let signedRecordsCache = [];

  function showRevokeStatus(msg, type) {
    document.getElementById('revokeStatusBox').innerHTML = '<div class="status ' + type + '">' + msg + '</div>';
  }

  function loadSignedRecords() {
    google.script.run
      .withSuccessHandler(function(records) {
        signedRecordsCache = records;
        const select = document.getElementById('revokeSelect');
        select.innerHTML = '<option value="">-- เลือกรายการที่เซ็นแล้ว --</option>';
        records.forEach(function(rec) {
          const opt = document.createElement('option');
          opt.value = rec.id;
          opt.textContent = rec.id + ' | เซ็นโดย ' + rec.signedBy + ' · ' + rec.signedDateTime;
          select.appendChild(opt);
        });
      })
      .withFailureHandler(function(err) {
        showRevokeStatus('โหลดรายการไม่สำเร็จ: ' + err.message, 'error');
      })
      .getSignedRecords();
  }

  document.getElementById('revokeSelect').addEventListener('change', function(e) {
    document.getElementById('revokeStatusBox').innerHTML = '';
    if (!e.target.value) {
      document.getElementById('revokeDetail').classList.add('hidden');
      return;
    }
    const rec = signedRecordsCache.find(function(r) { return r.id === e.target.value; });
    if (!rec) return;
    currentRevokeRecord = rec;
    const rows = [
      ['เลขที่บันทึก', rec.id],
      ['เซ็นโดย', rec.signedBy || '-'],
      ['เซ็นเมื่อ', rec.signedDateTime || '-'],
      ['PDF เดิม', rec.pdfUrl ? '<a href="' + rec.pdfUrl + '" target="_blank" rel="noopener">เปิดดู PDF</a>' : '-']
    ];
    document.getElementById('revokeTable').innerHTML = rows.map(function(r) {
      return '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>';
    }).join('');
    document.getElementById('revokeReason').value = '';
    document.getElementById('revokeDetail').classList.remove('hidden');
  });

  document.getElementById('revokeBtn').addEventListener('click', function() {
    if (!currentRevokeRecord) return;
    const reason = document.getElementById('revokeReason').value.trim();
    if (!reason) {
      showRevokeStatus('กรุณาระบุเหตุผลก่อนยกเลิกการลงนาม', 'error');
      return;
    }
    if (!confirm('ยืนยันยกเลิกการลงนามเลขที่ ' + currentRevokeRecord.id + ' ใช่หรือไม่?\nรายการนี้จะกลับไปรอเซ็นใหม่')) return;

    const btn = this;
    btn.disabled = true;
    btn.textContent = 'กำลังยกเลิก...';

    google.script.run
      .withSuccessHandler(function() {
        showRevokeStatus('ยกเลิกการลงนามสำเร็จ — รายการ ' + currentRevokeRecord.id + ' กลับไปรอเซ็นใหม่แล้ว', 'success');
        document.getElementById('revokeDetail').classList.add('hidden');
        document.getElementById('revokeSelect').value = '';
        currentRevokeRecord = null;
        btn.disabled = false;
        btn.textContent = 'ยืนยันยกเลิกการลงนามนี้';
        loadSignedRecords();
        loadPendingRecords(); // รายการที่ถูกยกเลิกจะกลับมาโผล่ในนี้
      })
      .withFailureHandler(function(err) {
        showRevokeStatus('ยกเลิกไม่สำเร็จ: ' + err.message, 'error');
        btn.disabled = false;
        btn.textContent = 'ยืนยันยกเลิกการลงนามนี้';
      })
      .revokeSignature(currentRevokeRecord.id, currentRevokeRecord._rowNumber, reason);
  });

  document.getElementById('revokeCancelBtn').addEventListener('click', function() {
    document.getElementById('revokeDetail').classList.add('hidden');
    document.getElementById('revokeSelect').value = '';
    currentRevokeRecord = null;
    document.getElementById('revokeStatusBox').innerHTML = '';
  });
</script>
</body>
</html>
